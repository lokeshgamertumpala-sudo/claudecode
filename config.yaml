    - step: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-minimax", "backup-deepseek"]
    - minimaxai/minimax-m3.1-flash: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-deepseek"]
    - minimax-m3.1-flash: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-deepseek"]
    - minimax: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-deepseek"]
    - nvidia/nemotron-3-ultra-550b-a55b: ["backup-laguna", "backup-mistral", "backup-minimax", "backup-step", "backup-deepseek"]
    - nemotron-ultra: ["backup-laguna", "backup-mistral", "backup-minimax", "backup-step", "backup-deepseek"]
    - ultra: ["backup-laguna", "backup-mistral", "backup-minimax", "backup-step", "backup-deepseek"]
    - deepseek-ai/deepseek-v4.1-flash: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-minimax"]
    - deepseek-v4.1-flash: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-minimax"]
    - deepseek: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-minimax"]
    - backup-mistral: ["backup-ultra", "backup-laguna", "backup-step", "backup-minimax", "backup-deepseek"]
    - backup-step: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-minimax", "backup-deepseek"]
    - backup-minimax: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-deepseek"]
    - backup-ultra: ["backup-laguna", "backup-mistral", "backup-minimax", "backup-step", "backup-deepseek"]
    - backup-deepseek: ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-minimax"]
    - backup-laguna: ["backup-ultra", "backup-mistral", "backup-deepseek", "backup-step"]
    - laguna: ["backup-ultra", "backup-mistral", "backup-deepseek", "backup-step"]
    - "*": ["backup-ultra", "backup-laguna", "backup-mistral", "backup-step", "backup-minimax", "backup-deepseek"]

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  retry_after: 0.2
  request_timeout: 120
  stream_timeout: 120
  timeout: 120
  max_tokens: 8192
  callbacks: ["sanitize_hook.proxy_handler_instance"]

general_settings:
  master_key: "sk-litellm-proxy-key"
