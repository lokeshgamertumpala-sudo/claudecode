router_settings:
  num_retries: 3
  retry_after: 0.5
  fallbacks:
    - moonshotai/kimi-k3: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - kimi-k3: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - kimi: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - backup-nemotron: ["deepseek-v4-flash", "backup-laguna", "moonshotai/kimi-k3"]
    - nemotron: ["deepseek-v4-flash", "backup-laguna", "moonshotai/kimi-k3"]
    - backup-laguna: ["backup-nemotron", "deepseek-v4-flash", "moonshotai/kimi-k3"]
    - laguna: ["backup-nemotron", "deepseek-v4-flash", "moonshotai/kimi-k3"]
    - deepseek-ai/deepseek-v4-pro-0813: ["deepseek-v4-flash", "backup-nemotron", "backup-laguna"]
    - deepseek-v4-pro: ["deepseek-v4-flash", "backup-nemotron", "backup-laguna"]
    - deepseek-ai/deepseek-v4-flash-0731: ["backup-nemotron", "backup-laguna", "moonshotai/kimi-k3"]
    - deepseek-v4-flash: ["backup-nemotron", "backup-laguna", "moonshotai/kimi-k3"]
    - deepseek: ["backup-nemotron", "backup-laguna", "moonshotai/kimi-k3"]
    - claude-sonnet-4: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - claude-sonnet-4-5: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - claude-3-7-sonnet-20250219: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - claude-3-5-sonnet-20241022: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - claude-3-5-haiku-20241022: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - claude-haiku-4-5: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - claude-opus-4: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - claude-opus-4-5: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - claude-3-opus-20240229: ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]
    - "*": ["backup-nemotron", "deepseek-v4-flash", "backup-laguna"]

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  retry_after: 0.5
  request_timeout: 300
  stream_timeout: 300
  max_tokens: 8192
  callbacks: ["sanitize_hook.proxy_handler_instance"]

general_settings:
  master_key: "sk-litellm-proxy-key"
