      model: "nvidia_nim/moonshotai/kimi-k3"
      api_key: "os.environ/NVIDIA_API_KEY"

  - model_name: "kimi-k3"
    litellm_params:
      model: "nvidia_nim/moonshotai/kimi-k3"
      api_key: "os.environ/NVIDIA_API_KEY"

  # Automatic high-reliability fallbacks & models on NVIDIA NIM
  - model_name: "nvidia/nemotron-3-super-120b-a12b"
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"
      api_key: "os.environ/NVIDIA_API_KEY"

  - model_name: "nemotron"
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"
      api_key: "os.environ/NVIDIA_API_KEY"

  - model_name: "backup-nemotron"
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"
      api_key: "os.environ/NVIDIA_API_KEY"

  - model_name: "poolside/laguna-xs-2.1"
