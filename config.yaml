    - mistralai/mistral-large-4-1t-a52b: ["backup-ultra", "backup-laguna", "backup-step", "backup-minimax", "backup-deepseek"]
    - mistral-large-4: ["backup-ultra", "backup-laguna", "backup-step", "backup-minimax", "backup-deepseek"]
