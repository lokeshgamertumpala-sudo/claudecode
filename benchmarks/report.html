lf-attention mechanism, which lets every token directly interact with every other token in the sequence, regardless of distance. For each token, the model computes three learned projections\u2014query, key, and value\u2014and calculates attention weights by measuring the dot product between queries and keys. These weights determine how much focus each token should place on others, producing a context-aware representation that aggregates information from the whole sequence. This computation is performed in parallel across multiple \"heads\" in multi-head attention, enabling the model to capture diverse relationships such as syntax, semantics, and coreference simultaneously.\n\nThese attention operations are repeated across many identical layers, each combining self-attention with a position-wise feed-forward network. The feed-forward sub-layer applies the same two-layer multilayer perceptron independently to every token, further refining the attended representations. In the original design, a stack of encoder layers processes the full input sequence bidirectionally and in parallel, while a separate stack of decoder layers generates output autoregressively, using a mask to prevent attending to future tokens. This architecture, which eliminates recurrence and convolutions entirely, has become the foundation for modern large language models, powering everything from bidirectional encoders like BERT to generative decoders like GPT.", "quality_pass": true, "quality_details": {"non_empty": true, "finished_naturally": true, "valid_json": "not_required", "json_fields_present": "not_required", "expected_keywords_found": ["attention", "encoder", "decoder"], "expected_keywords_missing": [], "keywords_present": true}}, {"model": "nvidia/nemotron-3.5-lightning-30b-a3b", "prompt_id": "long", "run": 1, "ttft_ms": 367.50649999885354, "total_latency_ms": 32891.88060000015, "prompt_tokens": 0, "completion_tokens": 2848, "tokens_per_sec": 87.56509783227116, "http_status": 200, "error": null, "finish_reason": "stop", "response_text": "# Microservices vs. Monolithic Architectures: A Trade-Off Analysis\n\n## Introduction\nChoosing between a monolithic and microservices architecture is a foundational decision that impacts scalability, team structure, deployment velocity, and long-term operational cost. Neither is universally superior; the right choice depends on organization size, domain complexity, traffic patterns, and team maturity. Below is a comprehensive breakdown of trade-offs across five critical dimensions, each paired with concrete, real-world examples.\n\n---\n\n## 1. Scalability\n\n| **Monolithic** | **Microservices** |\n| :--- | :--- |\n| **Vertical scaling only** \u2013 you add more CPU/RAM to a single instance. Scaling one feature (e.g., search) scales the entire app, often over-provisioning other components. | **Horizontal, per-service scaling** \u2013 individual services can be replicated independently based on demand. Enables right-sizing resources per function. |\n| **Simpler infrastructure** \u2013 one process, one load balancer, one deployment target. | **Orchestration overhead** \u2013 requires service discovery, load balancers, container orchestration (K8s, ECS), and network routing. |\n| **Resource inefficiency** at scale: if one function needs 8 vCPUs, the whole app is limited to that allocation per instance. | **Granular cost control** \u2013 you can run a lightweight authentication service on minimal hardware while spawning 50 instances of a payment processor. |\n\n### Concrete Examples\n- **Netflix**: Transitioned from a monolith to microservices specifically to achieve per-service scalability. Their recommendation engine, streaming backend, and authentication each scale independently based on distinct traffic patterns. During peak events, they can spin up thousands of recommendation service instances without touching the streaming pipeline.\n- **Basecamp/37signals**: Remains largely monolithic. Their SaaS product has a single, well-defined domain. Scaling means adding more app servers behind a load balancer. They avoid the distributed complexity of microservices because their traffic profile and team structure don\u2019t justify it.\n\n---\n\n## 2. Deployment Complexity\n\n| **Monolithic** | **Microservices** |\n| :--- | :--- |\n| **Single artifact** \u2013 CI/CD pipelines build, test, and deploy one version. Rollbacks are immediate (replace the whole binary). | **Multiple artifacts** \u2013 each service has its own pipeline, version, and deployment cadence. Requires contract testing, schema evolution management, and coordination of dependent services. |\n| **Faster initial setup** \u2013 a single repo, one build matrix, one environment. | **Pipeline sprawl** \u2013 dozens/hundreds of pipelines, environment parity challenges, and dependency mapping. |\n| **All-or-nothing risk** \u2013 a bad deploy takes down the entire system, but fix is uniform. | **Independent risk** \u2013 a faulty service can be rolled back or disabled without affecting others, but requires careful feature flags and circuit breakers. |\n\n### Concrete Examples\n- **Amazon**: Pioneered the \"two-pizza team\" model with microservices. They deploy code to production every 11.7 seconds on average (per internal data). Each service has independent pipelines, and failures are contained via strict interface contracts and automated canary releases.\n- **Etsy** (early monolith): In the mid-2000s, Etsy operated a Ruby on Rails monolith. Deploys were initially risky and manual, but they invested heavily in feature flags, automated testing, and a robust rollback strategy, allowing them to deploy multiple times daily without breaking the whole site. Their experience helped popularize safe monolith deployment practices.\n\n---\n\n## 3. Team Autonomy\n\n| **Monolithic** | **Microservices** |\n| :--- | :--- |\n| **Shared codebase** \u2013 all developers work in the same repo/branch. Easier to maintain consistent patterns, but creates merge conflicts and coordination overhead as team size grows. | **Bounded contexts** \u2013 each team owns a service end-to-end (code, DB, API, ops). Teams can choose their own language, framework, and data store best suited to their problem. |\n| **Slower feature velocity at scale** \u2013 merge conflicts, code review bottlenecks, and \"trunk-based\" coordination slow down large teams. | **Faster per-team iteration** \u2013 a team can ship to production without waiting for consensus on the entire codebase. However, they must adhere to API contracts and shared infra standards. |\n| **Easier onboarding** \u2013 new hires learn one codebase and deployment process. | **Steeper onboarding** \u2013 new hires must understand the service\u2019s domain, infra dependencies, networking, and contract testing before contributing. |\n\n### Concrete Examples\n- **Spotify**: Organized around \"squads\" (small, cross-functional teams) each owning a microservice or feature area. A squad can deploy its service independently, use whatever tech stack fits, and iterate without coordinating with other squads. This autonomy enabled rapid experimentation (e.g., Discover Weekly) but required heavy investment in DevOps culture, API governance, and \"guilds\" to prevent fragmentation.\n- **A small 5-person startup**: Often starts as a Python/Node monolith. All five developers push to the same branch, debug together, and deploy to a single Heroku/Render app. Autonomy is high in the sense that anyone can fix anything, but coordination overhead is minimal and decision-making is fast.\n\n---\n\n## 4. Debugging & Observability\n\n| **Monolithic** | **Microservices** |\n| :--- | :--- |\n| **Single process, single stack trace** \u2013 attach a debugger, print logs, and follow the execution path. Errors are typically process-local. | **Distributed tracing required** \u2013 a single user request may span 5\u201310 services. Requires correlation IDs, centralized logging (ELK/Datadog), and tracing ied domain.\n- Traffic is predictable and doesn't require per-feature scaling.\n- You prioritize fast initial delivery and low operational complexity.\n- Regulatory or compliance constraints favor a single, auditable codebase.\n- Example: A B2B SaaS tool, an internal admin panel, or a niche marketplace.\n\n### Move to Microservices if:\n- You have multiple distinct business domains with varying scaling needs.\n- Teams are organized around capabilities rather than layers, and need independent release cycles.\n- You have the maturity to invest in CI/CD, observability, and DevOps culture.\n- You're running on cloud-native infrastructure (K8s, serverless) and can absorb the overhead.\n- Example: Uber, Netflix, Airbnb, or any platform with high traffic variability, multiple product lines, or a need for rapid, independent experimentation.\n\n### The Middle Ground: Modular Monolith\nMany organizations start with a monolith and incrementally introduce module boundaries, dependency injection, and strict API layers. This \"modular monolith\" approach gives many benefits of separation (clear ownership, testability) without the distributed operational tax, until the scale or team size genuinely demands microservices.\n\n---\n\n## Final Thought\nThe microservices vs. monolith debate isn't binary\u2014it's a spectrum of organizational and technical maturity. The most successful architectures are those where the complexity matches the problem scale: a monolith that scales *well* via good engineering, or a microservice ecosystem that *actually* reduces friction through clear boundaries and automation. The best choice is the one that minimizes your specific trade-off pain points now, while leaving a clear upgrade path as your organization evolves.", "quality_pass": true, "quality_details": {"non_empty": true, "finished_naturally": true, "valid_json": "not_required", "json_fields_present": "not_required", "expected_keywords_found": ["microservices", "monolithic", "scalability", "depl 2421.8415999930585, "total_latency_ms": 81364.85420000099, "prompt_tokens": 0, "completion_tokens": 3292, "tokens_per_sec": 41.70096746472112, "http_status": 200, "error": null, "finish_reason": "stop", "response_text": "# Microservices vs. Monolithic Architectures: A Comprehensive Trade-off Analysis\n\nChoosing between these two architectural styles is one of the most consequential decisions in system design. Neither is universally superior\u2014each shifts costs and benefits across different dimensions. Below is a detailed analysis across the key areas you mentioned, plus a few others that often get overlooked.\n\n---\n\n## 1. Scalability\n\n### Monolith\n- **Coarse-grained scaling**: You scale the entire application as a unit. If only the payment module is under load, you still replicate the whole thing.\n- **Simple horizontal scaling**: Add more instances behind a load balancer. No distributed coordination needed.\n- **Vertical scaling ceiling**: Often easier to scale up (bigger machines) initially, but eventually hits hardware limits.\n- **Example**: A Django or Rails app running on 4 large EC2 instances handles 10k requests/second fine\u2014until one slow database query in the reporting module drags down the checkout flow for everyone.\n\n### Microservices\n- **Fine-grained, independent scaling**: Scale only the service under pressure. Netflix famously scales its streaming service independently of its recommendation engine.\n- **Technology heterogeneity**: The image-processing service can be written in Go, the ML pipeline in Python, the API gateway in Node.js\u2014each scaled with its own resource profile.\n- **Hidden costs**: Scaling one service can cascade. If the order service scales 10x but the inventory database doesn't, you've just moved the bottleneck. Distributed systems introduce network latency and require capacity planning across service boundaries.\n- **Example**: Shopify during Black Friday scales its checkout service to thousands of pods while leaving its blog/content service on a handful of instances\u2014something impossible in a monolith.\n\n**Verdict**: Microservices win when different components have *wildly different* load profiles. Monoliths win when load is uniform, because scaling is simpler and cheaper.\n\n---\n\n## 2. Deployment Complexity\n\n### Monolith\n- **Single artifact, single pipeline**: One build, one deploy, one rollback. A failed deploy is easy to revert.\n- **Atomic releases**: All features ship together, so there's no version-skew problem between components.\n- **Example**: GitHub historically deployed its monolithic Rails app multiple times per day with a simple chatops command (`/deploy`), with rollback being a single command.\n\n### Microservices\n- **Many pipelines**: Each service needs its own CI/CD pipeline, artifact registry, and deployment strategy. A 50-service system might have 50 pipelines to maintain.\n- **Version skew and compatibility**: Services deploy independently, so you must maintain backward compatibility of APIs, handle rolling upgrades, and sometimes run multiple versions simultaneously (blue-green, canary).\n- **Dependency ordering**: Deploying a change that spans services requires orchestration\u2014deploy the database schema first, then service A, then service B.\n- **Example**: Amazon's \"two-pizza teams\" each own their service's full lifecycle, but this requires massive investment in internal tooling (Apollo, their deployment system) to make deploys safe. Without that tooling, microservice deployment becomes chaos.\n\n**Verdict**: Monoliths are dramatically simpler to deploy. Microservices trade deployment simplicity for deployment *frequency and independence*\u2014but only if you invest heavily in automation.\n\n---\n\n## 3. Team Autonomy\n\n### Monolith\n- **Coordination overhead**: With 50 engineers on one codebase, merge conflicts, code review bottlenecks, and \"who owns this module?\" disputes are constant. Teams often organize into feature teams that nd partial failures**: Networks fail, services time out, retries cause duplicate side effects. A bug might only appear when service X is slow *and* service Y returns a 503.\n- **Harder local development**: Running 15 services locally requires Docker Compose orchestration, mock services, and significant RAM. Many teams use \"development environments in the cloud\" instead.\n- **Example**: At Uber, a single ride request flows through dozens of microservices; when something goes wrong, engineers rely on distributed tracing (Jaeger) and centralized logging (ELK stack) to reconstruct the request path. The operational cost of this observability stack is substantial.\n\n**Verdict**: Monoliths are far easier to debug. Microservices *require* mature observability practices\u2014without them, you're flying blind.\n\n---\n\n## 5. Operational Overhead\n\n### Monolith\n- **Low infrastructure footprint**: A few servers, one database, one monitoring dashboard. Total cost of ownership is low.\n- **Simple ops**: One service to monitor, one log stream, one alerting config. A small team can run it 24/7.\n- **Example**: Basecamp runs its monolithic HEY email service on a handful of servers with a tiny ops team\u2014deliberately choosing simplicity over scale.\n\n### Microservices\n- **Infrastructure explosion**: Service mesh (Istio/Linkerd), API gateways, message brokers (Kafka, RabbitMQ), service discovery, config servers, container orchestration (Kubernetes), CI/CD for each service, secrets management (Vault), etc.\n- **On-call burden**: More services = more alerts = more pager duty. Burnout is a real risk; teams need SRE practices and error budgets.\n- **Data management complexity**: Each service often owns its own database (polyglot persistence), which means distributed transactions become hard\u2014you need sagas, event sourcing, or eventual consistency patterns.\n- **Example**: A 30-service system on Kubernetes might need a dedicated platform team of 5\u201310 engineers just to keep the infrastructure running, plus per-service on-call rotations.\n\n**Verdict**: Monoliths have dramatically lower operational overhead. Microservices shift complexity from *code* to *infrastructure*\u2014you don't eliminate complexity, you relocate it.\n\n---\n\n## 6. Additional Dimensions Worth Considering\n\n| Dimension | Monolith | Microservices |\n|---|---|---|\n| **Data consistency** | ACID transactions across the whole DB\u2014simple and reliable | Eventual consistency, sagas, distributed transactions\u2014hard |\n| **Testing** | Easy end-to-end tests in one process; fast integration tests | Need contract testing (Pact), test environments, mocking |\n| **Security** | Smaller attack surface; one perimeter | Larger attack surface; need mTLS, auth between services, zero-trust |\n| **Time to first product** | Fast\u2014build one thing and ship | Slow\u2014need infra, CI/CD, observability before first service ships |\n| **Refactoring** | Easy\u2014IDE refactoring across the whole codebase | Hard\u2014refactoring across service boundaries requires API versioning |\n| **Cost at small scale** | Cheap | Expensive (many small services = overhead) |\n| **Failure isolation** | One bug can take down everything | Failures are contained to one service (with circuit breakers) |\n\n---\n\n## 7. Concrete Real-World Examples\n\n- **Amazon**: Started as a monolith, migrated to services in the early 2000s. The famous \"Bezos mandate\" (2002) required all teams to expose service APIs. Result: massive scalability, but at the cost of enormous infrastructure investment.\n- **Netflix**: Went all-in on microservices during its 2008\u20132011 cloud migration, pioneering tools like Hystrix (circuit breakers) and Chaos Monkey. Handles billions of streaming requests daily\u2014but employs thousands of engineers.\n- **Shopify**: Runs a *modular monolith*\u2014a single deployable Rails app with strict internal module boundaries. They get team autonomy via code organization rather than services, and can still deploy atomically. This is a popular middle ground.\n- **GitHub**: Deliberately stayed monolithic (with some extracted services) for years, deploying multiple times daily. They only extracted services where scaling demands justified it.\n- **Basecamp / 37signals**: Runs HEY and Basecamp as monoliths on few servers, arguing that for their scale, microservices would be pure overhead.\n- **SoundCloud**: Started monolithic, extracted services only for components with distinct scaling needs (e.g., file uploads), keeping the core monolithic.\n- **Twitter**: Migrated from a monolithic Rails app (\"the Fail Whale\" era) to microservices, which fixed scaling but introduced significant operational complexity.\n\n---\n\n## 8. The \"Modular Monolith\" Middle Ground\n\nMany teams now land here: a **single deployable application with strict internal module boundaries** (Shopify's approach). You get:\n- Monolith simplicity (one deploy, one DB, easy debugging)\n- Team autonomy via clear module ownership and internal APIs\n- The *option* to extract a module into a service later if it needs independent scaling\n\nExtraction is much easier than splitting a tangled monolith, provided the boundaries were enforced from the start (e.g., via package-level dependency rules, ArchUnit tests, or tools like Spring Modulith).\n\n---\n\n## 9. Decision Framework: When to Choose What\n\n**Choose a monolith when:**\n- Team is small (< 10\u201315 engineers)\n- Product is early-stage; requirements are changing rapidly\n- Load is uniform across features\n- You lack DevOps/SRE maturity\n- Time-to-market matters most\n\n**Choose microservices when:**\n- Different components have very different scaling/availability needs\n- You have many teams that need to deploy independently\n- You need technology diversity (e.g., ML in Python, real-time in Go)\n- A single team's failure shouldn't take down the whole system\n- You have the infrastructure and observability maturity to support it\n\n*     const PROMPTS = DATA.prompts;

    function fmt(n, d=1) { return n ? Number(n).toFixed(d) : '—'; }
    function scoreClass(s) { return s >= 75 ? 'score-green' : s >= 50 ? 'score-amber' : 'score-red'; }
    function ringColor(s) { return s >= 75 ? 'var(--green)' : s >= 50 ? 'var(--amber)' : 'var(--red)'; }

    document.getElementById('ts').textContent = new Date(DATA.timestamp).toLocaleString();
    document.getElementById('runs').textContent = DATA.total_runs;
    document.getElementById('tokens').textContent = DATA.total_tokens.toLocaleString();
    document.getElementById('models-count').textContent = DATA.models_tested.length;

    const models = Object.entries(DATA.summaries).sort((a,b) => b[1].overall_score - a[1].overall_score);
    const ringsEl = document.getElementById('rings');
    const tbody = document.getElementById('leaderboard-body');

    models.forEach(([model, summary], idx) => {
      const score = summary.overall_score;
      const offset = 339 * (1 - score / 100);
      ringsEl.innerHTML += `
        <div class="ring-card">
          <svg class="ring-svg" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="54"/>
            <circle class="ring-progress" cx="60" cy="60" r="54" style="stroke: ${ringColor(score)}; stroke-dashoffset: ${offset};"/>
          </svg>
          <div class="ring-text" style="color: ${ringColor(score)}">${fmt(score)}</div>
          <div class="ring-label">${model.split('/').pop()}</div>
        </div>
      `;

      const tr = document.createElement('tr');
      tr.style.animationDelay = `${(idx+1)*0.05}s`;
      tr.innerHTML = `
        <td>${idx+1}</td>
        <td class="model-name">${model}</td>
        <td class="score-cell ${scoreClass(score)}">${fmt(score)}</td>
        <td class="score-cell ${scoreClass(summary.speed_score/0.35*100)}">${fmt(summary.speed_score)}</td>
        <td class="score-cell ${scoreClass(summary.throughput_score/0.20*100)}">${fmt(summary.throughput_score)}</td>
        <td class="score-cell ${scoreClass(summary.quality_score/0.30*100)}">${fmt(summary.quality_score)}</td>
        <td class="score-cell ${scoreClass(summary.reliability_score/0.15*100)}">${fmt(summary.reliability_score)}</td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('#leaderboard-table th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        const rows = Array.from(tbody.rows);
        const isAsc = th.classList.toggle('sorted-asc');
        th.classList.toggle('sorted-desc', !isAsc);
        document.querySelectorAll('#leaderboard-table th').forEach(h => {
          if (h !== th) h.classList.remove('sorted-asc', 'sorted-desc');
        });
        const colMap = {rank:0, model:1, score:2, speed:3, throughput:4, quality:5, reliability:6};
        rows.sort((a,b) => {
          const av = a.cells[colMap[col]].textContent;
          const bv = b.cells[colMap[col]].textContent;
          const an = parseFloat(av), bn = parseFloat(bv);
          return isAsc ? (an - bn) : (bn - an);
        });
        rows.forEach((r,i) => { r.style.animationDelay = `${(i+1)*0.05}s`; tbody.appendChild(r); });
      });
    });

    const modelNames = models.map(m => m[0].split('/').pop());
    const ttftData = models.map(m => m[1].prompt_summaries?.short?.ttft_ms?.p50 || 0);
    const tpsData = models.map(m => m[1].prompt_summaries?.short?.tokens_per_sec?.p50 || 0);

    new Chart(document.getElementById('chart-ttft'), {
      type: 'bar',
      data: { labels: modelNames, datasets: [{
        label: 'TTFT (ms)', data: ttftData, backgroundColor: 'rgba(88,166,255,0.6)', borderColor: 'var(--accent)', borderWidth: 1,
        borderRadius: 6, borderSkipped: false,
      }]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.raw} ms` } } }, scales: { y: { beginAtZero: true, grid: { color: 'var(--border)' }, ticks: { color: 'var(--text-muted)' } }, x: { grid: { display: false }, ticks: { color: 'var(--text-muted)' } } }, animation: { duration: 800, easing: 'easeOutQuart' } }
    });

    new Chart(document.getElementById('chart-tps'), {
      type: 'bar',
      data: { labels: modelNames, datasets: [{
        label: 'Tokens/sec', data: tpsData, backgroundColor: 'rgba(63,185,80,0.6)', borderColor: 'var(--green)', borderWidth: 1,
        borderRadius: 6, borderSkipped: false,
      }]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.raw.toFixed(1)} tok/s` } } }, scales: { y: { beginAtZero: true, grid: { color: 'var(--border)' }, ticks: { color: 'var(--text-muted)' } }, x: { grid: { display: false }, ticks: { color: 'var(--text-muted)' } } }, animation: { duration: 800, easing: 'easeOutQuart' } }
    });

    const headersEl = document.getElementById('heatmap-headers');
    const bodyEl = document.getElementById('heatmap-body');
    PROMPTS.forEach((p, i) => { headersEl.innerHTML += `<th><span class="prompt-label">${p.name}</span></th>`; });
    models.forEach(([model, summary], mi) => {
      let row = `<td class="model-name">${model.split('/').pop()}</td>`;
      PROMPTS.forEach((p, pi) => {
        const ps = summary.prompt_summaries?.[p.id];
        const rate = ps?.quality_pass_rate ?? null;
        let cls = 'cell-unknown', txt = '?';
        if (rate !== null) {
          if (rate >= 0.9) { cls = 'cell-pass'; txt = '✓'; }
          else if (rate > 0) { cls = 'cell-fail'; txt = `${Math.round(rate*100)}%`; }
          else { cls = 'cell-fail'; txt = '✗'; }
        }
        row += `<td><div class="cell ${cls}" style="animation-delay:${pi*0.05 + mi*0.1}s">${txt}</div></td>`;
      });
      const tr = document.createElement('tr');
      tr.innerHTML = row;
      bodyEl.appendChild(tr);
    });

    const detailsGrid = document.getElementById('details-grid');
    models.forEach(([model, summary]) => {
      PROMPTS.forEach(p => {
        const ps = summary.prompt_summaries?.[p.id];
        if (!ps) return;
        const card = document.createElement('div');
        card.className = 'detail-card';
        card.innerHTML = `
          <div class="detail-header" onclick="this.parentElement.classList.toggle('open')">
            <span class="detail-title">${p.name} <span style="color:var(--text-muted);font-weight:400">(${model.split('/').pop()})</span></span>
            <span class="detail-toggle">▼</span>
          </div>
          <div class="detail-body">
            <div class="metric-row"><span class="metric-label">Runs</span><span class="metric-value">${ps.runs} (${ps.successful_runs} ok)</span></div>
            <div class="metric-row"><span class="metric-label">TTFT (p50/p95)</span><span class="metric-value">${fmt(ps.ttft_ms.p50)} / ${fmt(ps.ttft_ms.p95)} ms</span></div>
            <div class="metric-row"><span class="metric-label">Latency (p50/p95)</span><span class="metric-value">${fmt(ps.total_latency_ms.p50)} / ${fmt(ps.total_latency_ms.p95)} ms</span></div>
            <div class="metric-row"><span class="metric-label">Throughput (p50/p95)</span><span class="metric-value">${fmt(ps.tokens_per_sec.p50)} / ${fmt(ps.tokens_per_sec.p95)} tok/s</span></div>
            <div class="metric-row"><span class="metric-label">Quality Pass Rate</span><span class="metric-value">${fmt(ps.quality_pass_rate*100,0)}%</span></div>
            <div class="metric-row"><span class="metric-label">Success Rate</span><span class="metric-value">${fmt(ps.success_rate*100,0)}%</span></div>
          </div>
        `;
        detailsGrid.appendChild(card);
      });
    });

    const findingsEl = document.getElementById('findings-list');
    models.forEach(([model, summary]) => {
      summary.findings.forEach((f, fi) => {
        const div = document.createElement('div');
        div.className = 'finding-item';
        div.style.animationDelay = `${fi*0.1}s`;
        div.textContent = `${model.split('/').pop()}: ${f}`;
        findingsEl.appendChild(div);
      });
    });
  </script>
