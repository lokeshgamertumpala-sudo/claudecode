<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neutromstar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%}

.ui{position:fixed;z-index:100;pointer-events:none}

.list{display:flex;flex-direction:column;gap:6px}
.btn{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0a1428;border:1px solid #1a2a4a;border-radius:8px;color:#cfe3ff;font-size:.85rem;cursor:pointer;transition:.15s;width:100%;text-align:left}
.btn:hover{border-color:#3a5a8a;background:#102040;transform:translateX(4px)}
.btn.on{border-color:#64b5ff;background:#142850;box-shadow:0 0 16px #64b5ff40}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;padding:4px}
.ctl{display:flex;align-items:center;gap:8px;font-size:.75rem;color:#8ab4e8}
.ctl input[type=range]{width:100px;accent-color:#64b5ff}
.ctl span{min-width:36px;text-align:right;color:#a8d0ff;font-variant-numeric:tabular-nums}
.btn2{padding:8px 16px;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn2.pri{background:linear-gradient(135deg,#64b5ff,#4a90d9);color:#030308}
.btn2.pri:hover{transform:translateY(-1px);box-shadow:0 4px 16px #64b5ff60}
.btn2.sec{background:transparent;color:#64b5ff;border:1px solid #3a5a8a}
.btn2.sec:hover{background:#102040}
.info{width:280px;max-height:60vh;overflow:auto;display:none}
.info.on{display:block;animation:sl .2s ease}

.info h2{font-size:1rem;color:#64b5ff;margin-bottom:10px}
.fact{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a2a4a;font-size:.75rem}
.fact:last-child{border:none}
.fact b{color:#8ab4e8}
.desc{margin-top:10px;font-size:.75rem;line-height:1.5;color:#9ab8e8}
.speed{top:16px;left:50%;transform:translateX(-50%);background:rgba(3,3,8,.95);border:1px solid #1a2a4a;border-radius:999px;padding:6px 16px;color:#64b5ff;font-size:.75rem;font-weight:500;pointer-events:none;white-space:nowrap}
.legend{font-size:.65rem;line-height:1.8;color:#8ab4e8}
.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:16px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
#err{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#200;color:#f88;padding:20px;border-radius:12px;border:1px solid #f44;z-index:1000;max-width:90vw;text-align:center;display:none;font-family:monospace;font-size:.9rem;line-height:1.5}

</style>

  const D=[{n:'Sun',t:'Star',R:6.96,d:0,c:0xffcc00,e:0xffaa00,ei:1.5,rp:25.38,op:0,i:'Central star. 99.86% system mass. Surface 5,500°C. Core 15M°C.'},{n:'Mercury',t:'Rocky',R:.24,d:10,c:0xb5b5b5,rp:58.65,op:.24,i:'Smallest. -180°C to 430°C. No atmosphere. Cratered.'},{n:'Venus',t:'Rocky',R:.61,d:14,c:0xe6c87a,rp:-243,op:.62,i:'Hottest (465°C). Retrograde spin. Thick CO₂. Volcanic.'},{n:'Earth',t:'Rocky',R:.64,d:18,c:0x4a90d9,rp:1,op:1,i:'Only life known. 71% water. Magnetic field. 1 moon.'},{n:'Mars',t:'Rocky',R:.34,d:23,c:0xe86c3c,rp:1.03,op:1.88,i:'Red planet. Thin CO₂. Olympus Mons. 2 moons.'},{n:'Jupiter',t:'Gas',R:7.15,d:35,c:0xc9a876,rp:.41,op:11.86,i:'Largest. Great Red Spot. 95+ moons. Strong mag field. Faint rings.'},{n:'Saturn',t:'Gas',R:6.03,d:50,c:0xf4e4bc,rp:.44,op:29.46,i:'Prominent rings. 146+ moons. Density < water. Hex storm.'},{n:'Uranus',t:'Ice',R:2.56,d:65,c:0x7de3f4,rp:-.72,op:84,i:'Sideways rotation (98°). Coldest -224°C. 27 moons. Faint rings.'},{n:'Neptune',t:'Ice',R:2.48,d:80,c:0x4b70dd,rp:.67,op:164.8,i:'Windiest (2,100 km/h). Dark spots. 16 moons. Triton retrograde.'},{n:'Pluto',t:'Dwarf',R:.12,d:95,c:0xe8c8a0,rp:-6.39,op:248,i:'Kuiper Belt. Heart glacier. 5 moons. Elliptical tilted orbit.'}];

    for(let i=1;i<D.length;i++){
      const d=D[i],pts=[];for(let j=0;j<=128;j++){const a=j/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*d.d*sc,0,Math.sin(a)*d.d*sc));}
      const g=new THREE.BufferGeometry().setFromPoints(pts),m=new THREE.LineBasicMaterial({color:0x335577,transparent:true,opacity:.4,depthWrite:false});
      orbits.push(new THREE.Line(g,m));scene.add(orbits[i-1]);
    }
  }

  function ui(){L.innerHTML='';D.forEach((d,i)=>{const b=document.createElement('button');b.className='btn'+(i===0?' on':'');b.dataset.i=i;b.innerHTML=`<span class="dot" style="background:#${d.c.toString(16).padStart(6,'0')}"></span><div><div>${d.n}</div><div style="font-size:.65rem;color:#8ab4e8;text-transform:uppercase">${d.t}</div></div>`;b.onclick=()=>select(i);L.appendChild(b);});}

  function select(i){sel=i;L.querySelectorAll('.btn').forEach((b,j)=>b.classList.toggle('on',j===i));
  const d=D[i];T.textContent=d.n;let h='';if(i===0)h=`<div class="fact"><b>Type</b><span>${d.t}</span></div><div class="fact"><b>Radius</b><span>${d.R.toLocaleString()}k km</span></div><div class="fact"><b>Rotation</b><span>${d.rp} days</span></div><div class="fact"><b>Surface</b><span>~5,500°C</span></div><div class="fact"><b>Core</b><span>~15M°C</span></div>`;
  else h=`<div class="fact"><b>Type</b><span>${d.t}</span></div><div class="fact"><b>Radius</b><span>${(d.R*6371).toFixed(0)} km</span></div><div class="fact"><b>Distance</b><span>${(d.d*1.5).toFixed(1)} AU</span></div><div class="fact"><b>Rotation</b><span>${Math.abs(d.rp).toFixed(2)} days${d.rp<0?' (retro)':''}</span></div><div class="fact"><b>Orbit</b><span>${d.op.toFixed(2)} yrs</span></div>`;
  Dv.innerHTML=h+`<div class="desc">${d.i}</div>`;I.classList.add('on');
  if(i>0){const w=new THREE.Vector3();planets[i].m.getWorldPosition(w);ctl.target.lerp(w,.1);}else ctl.target.lerp(new THREE.Vector3,0.1);}

  function events(){
    o.oninput=e=>{ts=+e.target.value;ov.textContent=ts.toFixed(2)+'×';S.textContent=`Speed: ${ts.toFixed(2)}×`;};
    r.oninput=e=>{rs=+e.target.value;rv.textContent=rs.toFixed(2)+'×';};
    s.oninput=e=>{sc=+e.target.value;sv.textContent=sc.toFixed(2)+'×';rescale();};
    p.onclick=()=>{paused=!paused;p.textContent=paused?'Resume':'Pause';};
    x.onclick=()=>{cam.position.set(0,60,120);ctl.target.set(0,0,0);ctl.autoRotate=true;ts=rs=sc=1;o.value=r.value=s.value=1;ov.textContent=rv.textContent=sv.textContent='1.00×';S.textContent='Speed: 1.00×';rescale();select(0);};
    i.onclick=()=>I.classList.toggle('on');
    cv.onclick=e=>{if(e.target===cv)I.classList.remove('on');};
  }

  function rescale(){
    const s=planets[0],d=D[0];s.m.geometry.dispose();s.m.geometry=new THREE.SphereGeometry(d.R*sc,64,64);s.corona.geometry.dispose();s.corona.geometry=new THREE.SphereGeometry(d.R*1.15*sc,32,32);s.glow.geometry.dispose();s.glow.geometry=new THREE.SphereGeometry(d.R*1.5*sc,32,32);
    for(let i=1;i<planets.length;i++){
      const p=planets[i],d=D[i];p.m.geometry.dispose();p.m.geometry=new THREE.SphereGeometry(d.R*sc,48,48);p.m.position.x=d.d*sc;
      if(p.ring){p.ring.geometry.dispose();p.ring.geometry=new THREE.RingGeometry(d.R*1.3*sc,d.R*2.2*sc,64);}
      orbits[i-1].geometry.dispose();const pts=[];for(let j=0;j<=128;j++){const a=j/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*d.d*sc,0,Math.sin(a)*d.d*sc));}
      orbits[i-1].geometry=new THREE.BufferGeometry().setFromPoints(pts);
    }
  }

  function rsz(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);}

  function animate(){
    id=requestAnimationFrame(animate);
    if(!paused){const dt=.01*ts;
    for(let i=1;i<planets.length;i++){
      const p=planets[i];p.d.a+=dt/Math.max(p.d.op,.01)*Math.PI*2;p.p.rotation.y=p.d.a;
      const sp=dt/Math.max(Math.abs(p.d.rp),.01)*Math.PI*2*rs;p.m.rotation.y+=sp*(p.d.rp<0?-1:1);}
    planets[0].m.rotation.y+=dt*.1*rs;planets[0].corona.rotation.y+=dt*.05;planets[0].glow.rotation.y+=dt*.02;}
    scene.stars.rotation.y+=1e-5;ctl.update();ren.render(scene,cam);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
