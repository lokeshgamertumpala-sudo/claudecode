<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Apple Duo — Interactive 3D Experience</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍎</text></svg>">
<style>
  :root{
    --text:#f5f6f8; --text-dim:#a6adb8; --text-faint:#6b7280;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --glass:rgba(16,18,24,.55); --glass-strong:rgba(16,18,24,.78);
    --accent:#6ea8ff;
    --ease: cubic-bezier(.2,.8,.2,1);
    --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
    --sal: env(safe-area-inset-left,0px); --sar: env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%, #14161d 0%, #0b0c10 55%, #050509 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overscroll-behavior:none; touch-action:none;
  }
  #stage{position:fixed; inset:0; display:block;}
  canvas{display:block; touch-action:none;}

  /* Loading */
  #loader{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px; transition:opacity .9s var(--ease);
    background:radial-gradient(120% 90% at 50% 0%, #14161d 0%, #0b0c10 55%, #050509 100%);}
  #loader.gone{opacity:0; pointer-events:none;}
  .loader-word{font-weight:600; letter-spacing:.42em; text-transform:uppercase; font-size:15px; color:var(--text-dim); text-indent:.42em;}
  .loader-title{font-size:clamp(26px,5vw,52px); font-weight:700; letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff,#aeb6c4); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .loader-bar{width:min(260px,60vw); height:2px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden;}
  .loader-bar i{display:block; height:100%; width:0%; border-radius:2px; background:linear-gradient(90deg,#6ea8ff,#c4a7ff); transition:width .3s ease;}
  .loader-hint{margin-top:2px; font-size:12px; color:var(--text-faint); letter-spacing:.05em;}
  #loader-error{max-width:360px; text-align:center; line-height:1.6; color:#f0a9a9; font-size:13px;}

  /* Brand */
  #brand{position:fixed; z-index:40; top:calc(18px + var(--sat)); left:calc(22px + var(--sal));
    display:flex; flex-direction:column; gap:2px; pointer-events:none; opacity:0; transition:opacity 1s var(--ease) 1.4s;}
  #brand .bd{font-size:11px; font-weight:600; letter-spacing:.34em; text-transform:uppercase; color:var(--text-dim);}
  #brand .bt{font-size:20px; font-weight:700; letter-spacing:-.01em;}
  #brand .bs{font-size:12px; color:var(--text-faint); letter-spacing:.02em;}
  #brand.show{opacity:1;}

  /* Meta */
  #meta{position:fixed; z-index:38; top:calc(18px + var(--sat)); right:calc(20px + var(--sar));
    display:flex; align-items:center; gap:10px; opacity:0; transition:opacity 1s var(--ease) 2s;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint);}
  #meta .pill{display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:100px;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
  #meta .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}
  #meta.show{opacity:1;}

  /* Control bar */
  #controls{position:fixed; z-index:40; left:50%; transform:translateX(-50%);
    bottom:calc(24px + var(--sab)); display:flex; align-items:center; gap:6px; padding:8px;
    background:var(--glass-strong); border:1px solid var(--line); border-radius:22px;
    backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    opacity:0; transform:translateX(-50%) translateY(16px); transition:opacity .8s var(--ease) 1.6s, transform .8s var(--ease) 1.6s; max-width:calc(100vw - 20px);}
  #controls.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .cb{position:relative; width:44px; height:44px; border-radius:14px; border:1px solid transparent;
    background:transparent; color:var(--text-dim); cursor:pointer; display:grid; place-items:center;
    transition:all .18s var(--ease); user-select:none; flex:0 0 44px;}
  .cb svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .cb:hover{background:rgba(255,255,255,.06); color:var(--text);}
  .cb:active{transform:scale(.92);}
  .cb.on{background:linear-gradient(180deg,rgba(110,168,255,.22),rgba(196,167,255,.18)); border-color:rgba(110,168,255,.4); color:var(--accent);}
  .cb:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .sep{width:1px; height:26px; align-self:center; background:var(--line); margin:0 3px; flex:0 0 1px;}
  .cb .tip{position:absolute; bottom:calc(100% + 9px); left:50%; transform:translateX(-50%);
    background:#0d0f14; border:1px solid var(--line-strong); color:var(--text); padding:5px 10px;
    border-radius:9px; font-size:11px; white-space:nowrap; letter-spacing:.02em; opacity:0; pointer-events:none;
    transition:opacity .16s var(--ease); box-shadow:0 8px 22px rgba(0,0,0,.4);}
  .cb:hover .tip{opacity:1;}

  /* Camera flyout */
  #camwrap{position:absolute; bottom:calc(100% + 12px); left:50%; transform:translateX(-50%) scaleY(.8);
    transform-origin:bottom; display:flex; gap:4px; padding:7px; border-radius:14px;
    background:rgba(13,15,20,.92); border:1px solid var(--line-strong); backdrop-filter:blur(18px);
    opacity:0; pointer-events:none; transition:opacity .2s var(--ease), transform .2s var(--ease);}
  #camwrap.open{opacity:1; pointer-events:auto; transform:translateX(-50%) scaleY(1);}
  .cami{padding:7px 11px; border-radius:10px; font-size:12px; color:var(--text-dim); cursor:pointer;
    white-space:nowrap; border:1px solid transparent; transition:all .15s var(--ease);}
  .cami:hover{background:rgba(255,255,255,.06); color:var(--text);}
  .cami.on{background:linear-gradient(180deg,rgba(110,168,255,.2),rgba(196,167,255,.16)); color:var(--accent); border-color:rgba(110,168,255,.35);}

  /* Matte flyout */
  #matwrap{position:absolute; bottom:calc(100% + 12px); left:50%; transform:translateX(-50%) scaleY(.8);
    transform-origin:bottom; display:grid; grid-template-columns:repeat(3,auto); gap:6px; padding:8px;
    border-radius:16px; background:rgba(13,15,20,.92); border:1px solid var(--line-strong);
    backdrop-filter:blur(18px); opacity:0; pointer-events:none; transition:opacity .2s var(--ease), transform .2s var(--ease);}
  #matwrap.open{opacity:1; pointer-events:auto; transform:translateX(-50%) scaleY(1);}
  .fin{border-radius:12px; border:1px solid var(--line); cursor:pointer; padding:4px; background:rgba(255,255,255,.03); transition:all .16s var(--ease);}
  .fin .sw{width:34px; height:34px; border-radius:10px;}
  .fin small{display:block; text-align:center; font-size:10px; color:var(--text-dim); margin-top:4px; white-space:nowrap;}
  .fin.on{border-color:var(--accent); box-shadow:0 0 0 1px rgba(110,168,255,.5);}
  .fin:hover{transform:translateY(-2px);}

  /* Hint */
  #hint{position:fixed; z-index:30; left:50%; transform:translateX(-50%); bottom:calc(98px + var(--sab));
    font-size:12px; letter-spacing:.03em; color:var(--text-faint); text-align:center; pointer-events:none;
    opacity:0; transition:opacity 1.2s var(--ease) 2.6s;}
  body.touch #hint{display:none;}
  #hint.show{opacity:1;}
  #hint b{color:var(--text-dim); font-weight:500;}

  /* Annotations */
  .anno{position:absolute; transform:translate(-50%,-50%); opacity:0;
    transition:opacity .3s var(--ease); z-index:26;}
  .anno.show{opacity:1;}
  .anno .pin{width:15px; height:15px; margin:0 auto; border-radius:50%; cursor:pointer;
    background:rgba(11,13,18,.55); border:1px solid var(--line-strong); backdrop-filter:blur(10px); position:relative; transition:all .2s var(--ease);}
  .anno .pin::after{content:''; position:absolute; inset:-7px; border-radius:50%;
    border:1px solid rgba(110,168,255,.35); animation:annPulse 2.6s ease-out infinite;}
  @keyframes annPulse{0%{transform:scale(.55); opacity:1;} 70%,100%{transform:scale(1.5); opacity:0;}}
  .anno .lbl{position:absolute; top:100%; left:50%; transform:translateX(-50%) translateY(6px);
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); white-space:nowrap; text-align:center;}
  .anno .lbl::before{content:''; position:absolute; left:50%; top:-6px; transform:translateX(-50%); width:1px; height:6px; background:rgba(255,255,255,.25);}
  .anno .card{position:absolute; left:50%; bottom:calc(100% + 15px); transform:translateX(-50%);
    width:220px; background:rgba(13,15,20,.94); border:1px solid var(--line-strong);
    border-radius:14px; padding:13px 15px; opacity:0; pointer-events:none; transition:opacity .22s var(--ease);
    box-shadow:0 16px 40px rgba(0,0,0,.5); backdrop-filter:blur(18px); max-width:70vw;}
  .anno .card h4{margin:0 0 4px; font-size:13px; font-weight:650; letter-spacing:.01em;}
  .anno .card p{margin:0; font-size:11.5px; line-height:1.55; color:var(--text-dim);}
  .anno .card .tag{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; display:block;}
  .anno .pin:hover{background:rgba(110,168,255,.2); transform:scale(1.12);}
  .anno.open .card{opacity:1; pointer-events:auto;}
  .anno.open .pin{background:rgba(110,168,255,.3);}
  .anno.pc{pointer-events:none;}
  .anno.pc .pin{pointer-events:auto;}

  /* Debug */
  #debug{position:fixed; z-index:80; left:calc(14px + var(--sal)); bottom:calc(16px + var(--sab));
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; line-height:1.7;
    color:var(--text-dim); background:rgba(8,9,12,.72); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; backdrop-filter:blur(12px); opacity:0; pointer-events:none; transition:opacity .3s;}
  #debug.show{opacity:1; pointer-events:auto;}
  #debug b{color:var(--text); font-weight:600;}

  /* Mode caption */
  #modecap{position:fixed; z-index:30; left:calc(22px + var(--sal)); top:calc(88px + var(--sat));
    display:flex; flex-direction:column; gap:6px; pointer-events:none; opacity:0; transition:opacity .9s var(--ease) 2s;}
  #modecap.show{opacity:1;}
  #modecap .km{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--text-faint);}
  #modecap .kq{font-size:clamp(22px,3.4vw,40px); font-weight:700; letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff,#a9b2c0); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* Toast */
  #toast{position:fixed; z-index:50; left:50%; transform:translateX(-50%) translateY(12px);
    top:calc(20px + var(--sat)); padding:10px 18px; border-radius:13px; font-size:13px; font-weight:500;
    background:var(--glass-strong); border:1px solid var(--line-strong); backdrop-filter:blur(16px);
    opacity:0; pointer-events:none; transition:opacity .35s var(--ease), transform .35s var(--ease);
    max-width:80vw; text-align:center; box-shadow:0 12px 34px rgba(0,0,0,.4);}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Vignette */
  #vignette{position:fixed; inset:0; z-index:20; pointer-events:none; opacity:0; transition:opacity 1.2s ease;
    background:radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);}
  body.cine #vignette{opacity:1;}

  @media (max-width:700px){
    .cb{width:42px; height:42px; flex-basis:42px;}
    #controls{padding:6px; border-radius:18px; gap:4px;}
    #controls .sep{margin:0;}
    #modecap{top:calc(76px + var(--sat));}
  }
  @media (max-width:440px){
    .cb{width:38px; height:38px; flex-basis:38px;}
    #controls .cb .tip{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="vignette" aria-hidden="true"></div>

<div id="loader">
  <div class="loader-word">Apple Duo</div>
  <div class="loader-title">Apple&nbsp;Duo</div>
  <div class="loader-bar"><i id="loaderFill"></i></div>
  <div class="loader-hint" id="loaderHint">Preparing studio…</div>
  <div id="loader-error" hidden></div>
</div>

<section id="brand" aria-label="Brand">
  <span class="bd">Apple&nbsp;Duo</span>
  <span class="bt">Interactive Showcase</span>
  <span class="bs">A conceptual dual-panel workstation</span>
</section>

<section id="meta" aria-label="Status">
  <span class="pill"><span class="dot"></span>Studio Light</span>
</section>

<section id="modecap">
  <span class="km">Presentation</span>
  <span class="kq" id="modeTitle">Interactive</span>
</section>

<div id="hint"><b>Drag</b> to orbit · <b>Scroll</b>/<b>pinch</b> to zoom</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="debug" aria-live="polite"></div>

<div id="controls" role="toolbar" aria-label="Product controls">
  <button class="cb" id="btnOpen" aria-label="Open or close the device"><span class="tip">Open / close</span>
    <svg viewBox="0 0 24 24"><path d="m12 3 4 4h-3v10h3l-4 4-4-4h3V7H8z"/></svg></button>
  <button class="cb" id="btnExplode" aria-label="Toggle exploded view"><span class="tip">Explode</span>
    <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
  <span class="sep"></span>
  <button class="cb" id="btnCam" aria-label="Camera presets"><span class="tip">Camera</span>
    <svg viewBox="0 0 24 24"><path d="M3 7l5-4h11v10h-4l-4 4V7h-3"/><path d="M16 10h4v9l-3 2"/></svg></button>
  <div id="camwrap">
    <div class="cami on" data-cam="hero">Hero</div>
    <div class="cami" data-cam="front">Front</div>
    <div class="cami" data-cam="side">Profile</div>
    <div class="cami" data-cam="top">Top</div>
    <div class="cami" data-cam="detail">Macro</div>
  </div>
  <span class="sep"></span>
  <button class="cb" id="btnFinish" aria-label="Material finishes"><span class="tip">Finish</span>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
  <div id="matwrap"></div>
  <span class="sep"></span>
  <button class="cb" id="btnLight" aria-label="Toggle cinematic lighting"><span class="tip">Cinematic</span>
    <svg viewBox="0 0 24 24"><path d="M12 3c4 3 6 6 6 9a6 6 0 0 1-12 0c0-3 2-6 6-9z"/><path d="M12 21v-1"/></svg></button>
  <button class="cb on" id="btnAuto" aria-label="Toggle auto rotation"><span class="tip">Auto rotate</span>
    <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.6 5.9"/><path d="M4 20v-5h5"/></svg></button>
  <span class="sep"></span>
  <button class="cb" id="btnReset" aria-label="Reset view"><span class="tip">Reset (R)</span>
    <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M4 10a8 8 0 1 1 2.3 5.7"/></svg></button>
  <button class="cb" id="btnFull" aria-label="Toggle fullscreen"><span class="tip">Fullscreen (F)</span>
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M14 20h5v-5M10 20H5v-5"/></svg></button>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
// ===== Three.js & Addons =====
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ==========================================================================
   CONFIG, STATE & RUNTIME
   ========================================================================== */
const CONFIG = {
  panel: { w: 1.16, h: 1.66, t: 0.075 },
  finishes: ['Natural', 'Midnight', 'Silver', 'Graphite', 'White', 'Deep Blue'],
  autoRotateSpeed: 0.25,
  pausedIdleMs: 2500
};

const STATE = {
  isOpen: false,
  isExploded: false,
  autoRotate: true,
  cinematicMode: false,
  isDetail: false,
  finish: 'Natural',
  cameraMode: 'hero',
  openProgress: 0,
  explodeProgress: 0,
  targetOpen: 0,
  targetExplode: 0,
  targetCamPos: new THREE.Vector3(3.2, 2.0, 3.4),
  targetCamLook: new THREE.Vector3(0, 0.2, 0),
  touch: ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
  fps: 60,
  lastTime: performance.now()
};

const R = {
  renderer: null,
  scene: null,
  camera: null,
  controls: null,
  composer: null,
  bloom: null,
  keyLight: null,
  fillLight: null,
  rimLight: null,
  deviceGroup: null,
  leftPanel: null,
  rightPanel: null,
  hinge: null,
  leftExplodeParts: [],
  rightExplodeParts: []
};

/* ==========================================================================
   UTILITIES
   ========================================================================== */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

let _toastTimer = null;
function toast(msg, ms = 2200) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

function setLoader(pct, hint) {
  const f = $('#loaderFill');
  if (f) f.style.width = (pct * 100) + '%';
  if (hint && $('#loaderHint')) $('#loaderHint').textContent = hint;
}

function roundedShape(w, h, r) {
  const s = new THREE.Shape(), hw = w / 2, hh = h / 2;
  r = Math.min(r, hw, hh);
  s.moveTo(-hw + r, -hh);
  s.lineTo(hw - r, -hh);
  s.quadraticCurveTo(hw, -hh, hw, -hh + r);
  s.lineTo(hw, hh - r);
  s.quadraticCurveTo(hw, hh, hw - r, hh);
  s.lineTo(-hw + r, hh);
  s.quadraticCurveTo(-hw, hh, -hw, hh - r);
  s.lineTo(-hw, -hh + r);
  s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  s.closePath();
  return s;
}

function beveledSlab(w, h, depth, r, bevel = 0.012, thick = 0.008) {
  const g = new THREE.ExtrudeGeometry(roundedShape(w, h, r), {
    depth, bevelEnabled: true, bevelThickness: thick, bevelSize: bevel, bevelSegments: 3,
    steps: 1, curveSegments: 16
  });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return g;
}

/* ==========================================================================
   MATERIALS
   ========================================================================== */
const FINISH_COLORS = {
  Natural: 0xc4cad4,
  Midnight: 0x1a1d24,
  Silver: 0xe5e8ed,
  Graphite: 0x363a42,
  White: 0xf5f7fb,
  'Deep Blue': 0x162438
};

const MATERIALS = {
  shells: {},
  frame: null,
  screen: null,
  glassFront: null,
  glassBack: null,
  titaniumHinge: null,
  cameraRing: null,
  cameraLens: null
};

function makeMaterials() {
  function phys(color, opt = {}) {
    return new THREE.MeshPhysicalMaterial(Object.assign({
      color,
      metalness: 0.92,
      roughness: 0.28,
      clearcoat: 0.15,
      clearcoatRoughness: 0.35,
      envMapIntensity: 1.2
    }, opt));
  }

  for (const [name, hex] of Object.entries(FINISH_COLORS)) {
    MATERIALS.shells[name] = phys(hex);
  }

  MATERIALS.frame = phys(0x2a2d33, { metalness: 0.85, roughness: 0.38 });
  MATERIALS.titaniumHinge = phys(0x8a929e, { metalness: 0.95, roughness: 0.22, clearcoat: 0.3 });

  // Screen canvas texture (procedural Apple Duo wallpaper)
  const scv = document.createElement('canvas');
  scv.width = 512;
  scv.height = 720;
  const sctx = scv.getContext('2d');
  const sgrad = sctx.createLinearGradient(0, 0, 512, 720);
  sgrad.addColorStop(0, '#0a0d16');
  sgrad.addColorStop(0.4, '#1b2a47');
  sgrad.addColorStop(0.7, '#241a38');
  sgrad.addColorStop(1, '#0c0f17');
  sctx.fillStyle = sgrad;
  sctx.fillRect(0, 0, 512, 720);

  // Dynamic glass orb highlight
  const ograd = sctx.createRadialGradient(256, 320, 10, 256, 320, 220);
  ograd.addColorStop(0, 'rgba(110, 168, 255, 0.45)');
  ograd.addColorStop(0.5, 'rgba(196, 167, 255, 0.2)');
  ograd.addColorStop(1, 'rgba(0, 0, 0, 0)');
  sctx.fillStyle = ograd;
  sctx.fillRect(0, 0, 512, 720);

  // Time display
  sctx.fillStyle = '#ffffff';
  sctx.font = '600 48px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
  sctx.textAlign = 'center';
  sctx.fillText('9:41', 256, 140);
  sctx.font = '400 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
  sctx.fillStyle = '#a6adb8';
  sctx.fillText('Thursday, September 11', 256, 175);

  const screenTex = new THREE.CanvasTexture(scv);
  screenTex.colorSpace = THREE.SRGBColorSpace;

  MATERIALS.screen = new THREE.MeshBasicMaterial({ map: screenTex });
  MATERIALS.glassFront = new THREE.MeshPhysicalMaterial({
    color: 0x07090e,
    metalness: 0.1,
    roughness: 0.05,
    transmission: 0.95,
    ior: 1.52,
    thickness: 0.02,
    envMapIntensity: 1.4
  });
  MATERIALS.cameraRing = phys(0xd0d5de, { metalness: 0.98, roughness: 0.15 });
  MATERIALS.cameraLens = new THREE.MeshPhysicalMaterial({
    color: 0x05070a,
    metalness: 0.2,
    roughness: 0.05,
    transmission: 0.9,
    ior: 1.6
  });
}

/* ==========================================================================
   DEVICE BUILDER (APPLE DUO)
   ========================================================================== */
function buildDevice() {
  const { w, h, t } = CONFIG.panel;
  R.deviceGroup = new THREE.Group();

  // 1. Titanium Central Hinge
  const hingeG = new THREE.CylinderGeometry(t * 0.55, t * 0.55, h * 0.94, 24);
  R.hinge = new THREE.Mesh(hingeG, MATERIALS.titaniumHinge);
  R.hinge.castShadow = true;
  R.deviceGroup.add(R.hinge);

  // Function to construct a single display panel
  function createPanel(side) {
    const group = new THREE.Group();
    const isLeft = (side === 'left');
    const dir = isLeft ? -1 : 1;

    // Chassis body
    const bodyG = beveledSlab(w, h, t, 0.08);
    const bodyM = MATERIALS.shells[STATE.finish];
    const chassis = new THREE.Mesh(bodyG, bodyM);
    chassis.position.set(dir * (w / 2 + 0.015), 0, 0);
    chassis.castShadow = true;
    chassis.receiveShadow = true;
    group.add(chassis);

    // Bezel & Screen
    const screenW = w * 0.92;
    const screenH = h * 0.93;
    const screenG = new THREE.PlaneGeometry(screenW, screenH);
    const screenMesh = new THREE.Mesh(screenG, MATERIALS.screen);
    screenMesh.position.set(dir * (w / 2 + 0.015), 0, t / 2 + 0.006);
    group.add(screenMesh);

    // Front Ultra-thin Glass
    const glassG = new THREE.PlaneGeometry(screenW, screenH);
    const glassMesh = new THREE.Mesh(glassG, MATERIALS.glassFront);
    glassMesh.position.set(dir * (w / 2 + 0.015), 0, t / 2 + 0.007);
    group.add(glassMesh);

    // Back Camera Island (Right panel only)
    if (!isLeft) {
      const bumpW = 0.36, bumpH = 0.36, bumpT = 0.025;
      const bumpG = beveledSlab(bumpW, bumpH, bumpT, 0.06, 0.006, 0.004);
      const bumpMesh = new THREE.Mesh(bumpG, bodyM);
      bumpMesh.position.set(w * 0.68, h * 0.33, -t / 2 - bumpT / 2 - 0.004);
      bumpMesh.castShadow = true;
      group.add(bumpMesh);

      // Dual Lenses
      for (let i = 0; i < 2; i++) {
        const ly = h * 0.33 + (i === 0 ? 0.08 : -0.08);
        const ringG = new THREE.CylinderGeometry(0.065, 0.065, 0.014, 24);
        ringG.rotateX(Math.PI / 2);
        const ringM = new THREE.Mesh(ringG, MATERIALS.cameraRing);
        ringM.position.set(w * 0.68, ly, -t / 2 - bumpT - 0.006);
        group.add(ringM);

        const lensG = new THREE.CylinderGeometry(0.05, 0.05, 0.012, 24);
        lensG.rotateX(Math.PI / 2);
        const lensM = new THREE.Mesh(lensG, MATERIALS.cameraLens);
        lensM.position.set(w * 0.68, ly, -t / 2 - bumpT - 0.008);
        group.add(lensM);
      }
    }

    return { group, chassis, screenMesh };
  }

  // Left & Right Panels
  const left = createPanel('left');
  R.leftPanel = left.group;
  R.leftChassis = left.chassis;
  R.deviceGroup.add(R.leftPanel);

  const right = createPanel('right');
  R.rightPanel = right.group;
  R.rightChassis = right.chassis;
  R.deviceGroup.add(R.rightPanel);

  // Position device slightly elevated
  R.deviceGroup.position.y = 0.15;
  R.scene.add(R.deviceGroup);
}

/* ==========================================================================
   SCENE SETUP & LIGHTING
   ========================================================================== */
function initScene() {
  const stage = $('#stage');
  R.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  R.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  R.renderer.setSize(stage.clientWidth, stage.clientHeight);
  R.renderer.outputColorSpace = THREE.SRGBColorSpace;
  R.renderer.toneMapping = THREE.ACESFilmicToneMapping;
  R.renderer.toneMappingExposure = 1.15;
  R.renderer.shadowMap.enabled = true;
  R.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(R.renderer.domElement);

  R.scene = new THREE.Scene();

  // Environment lighting
  try {
    const pmrem = new THREE.PMREMGenerator(R.renderer);
    const roomEnv = new RoomEnvironment();
    R.scene.environment = pmrem.fromScene(roomEnv, 0.04).texture;
    roomEnv.dispose();
    pmrem.dispose();
  } catch (err) {
    console.warn('RoomEnvironment fallback', err);
  }

  R.camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.05, 80);
  R.camera.position.set(3.2, 2.0, 3.4);

  R.controls = new OrbitControls(R.camera, R.renderer.domElement);
  R.controls.enableDamping = true;
  R.controls.dampingFactor = 0.07;
  R.controls.minDistance = 1.2;
  R.controls.maxDistance = 8.5;
  R.controls.minPolarAngle = 0.1;
  R.controls.maxPolarAngle = Math.PI * 0.54;
  R.controls.target.set(0, 0.2, 0);
  R.controls.update();

  // Post-processing
  R.composer = new EffectComposer(R.renderer);
  R.composer.addPass(new RenderPass(R.scene, R.camera));
  R.bloom = new UnrealBloomPass(new THREE.Vector2(stage.clientWidth, stage.clientHeight), 0.45, 0.4, 0.88);
  R.composer.addPass(R.bloom);
  R.composer.addPass(new OutputPass());

  window.addEventListener('resize', onResize);
}

function initLights() {
  const s = R.scene;

  R.keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
  R.keyLight.position.set(4, 5, 3);
  R.keyLight.castShadow = true;
  R.keyLight.shadow.mapSize.set(1024, 1024);
  R.keyLight.shadow.camera.near = 0.5;
  R.keyLight.shadow.camera.far = 16;
  R.keyLight.shadow.radius = 4;
  R.keyLight.shadow.bias = -0.0003;
  s.add(R.keyLight);

  R.fillLight = new THREE.DirectionalLight(0xdde6fb, 1.1);
  R.fillLight.position.set(-4, 2, -3);
  s.add(R.fillLight);

  R.rimLight = new THREE.DirectionalLight(0xe8f0ff, 1.8);
  R.rimLight.position.set(-3, 3.5, -4);
  s.add(R.rimLight);

  const hemi = new THREE.HemisphereLight(0x9fb0cc, 0x1b1f28, 0.8);
  s.add(hemi);

  // Soft shadow ground
  const gg = new THREE.CircleGeometry(8, 48);
  const gm = new THREE.MeshStandardMaterial({ color: 0x08090d, roughness: 0.9, metalness: 0.1 });
  const ground = new THREE.Mesh(gg, gm);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.55;
  ground.receiveShadow = true;
  s.add(ground);
}

function onResize() {
  const stage = $('#stage');
  if (!stage || !R.camera || !R.renderer) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  R.camera.aspect = w / h;
  R.camera.updateProjectionMatrix();
  R.renderer.setSize(w, h);
  R.composer.setSize(w, h);
}

/* ==========================================================================
   INTERACTIONS & UI BINDINGS
   ========================================================================== */
function toggleOpen() {
  STATE.isOpen = !STATE.isOpen;
  STATE.targetOpen = STATE.isOpen ? 1 : 0;
  $('#btnOpen').classList.toggle('on', STATE.isOpen);
  $('#modeTitle').textContent = STATE.isOpen ? 'Opened Mode' : 'Folded Mode';
  toast(STATE.isOpen ? 'Apple Duo Opened (180° Desk Mode)' : 'Apple Duo Closed');
}

function toggleExplode() {
  STATE.isExploded = !STATE.isExploded;
  STATE.targetExplode = STATE.isExploded ? 1 : 0;
  $('#btnExplode').classList.toggle('on', STATE.isExploded);
  $('#modeTitle').textContent = STATE.isExploded ? 'Exploded Anatomy' : 'Interactive';
  toast(STATE.isExploded ? 'Exploded View Activated' : 'Assembled View');
}

function toggleCinematic() {
  STATE.cinematicMode = !STATE.cinematicMode;
  $('#btnLight').classList.toggle('on', STATE.cinematicMode);
  document.body.classList.toggle('cine', STATE.cinematicMode);
  if (STATE.cinematicMode) {
    R.keyLight.intensity = 1.4;
    R.rimLight.intensity = 3.2;
    R.rimLight.color.setHex(0x8cb6ff);
    R.bloom.strength = 0.85;
    toast('Cinematic Lighting Active');
  } else {
    R.keyLight.intensity = 2.6;
    R.rimLight.intensity = 1.8;
    R.rimLight.color.setHex(0xe8f0ff);
    R.bloom.strength = 0.45;
    toast('Studio Lighting Active');
  }
}

function toggleAuto() {
  STATE.autoRotate = !STATE.autoRotate;
  $('#btnAuto').classList.toggle('on', STATE.autoRotate);
  toast(STATE.autoRotate ? 'Auto Rotation Resumed' : 'Auto Rotation Paused');
}

function resetAll() {
  STATE.isOpen = false;
  STATE.targetOpen = 0;
  STATE.isExploded = false;
  STATE.targetExplode = 0;
  STATE.autoRotate = true;
  $('#btnOpen').classList.remove('on');
  $('#btnExplode').classList.remove('on');
  $('#btnAuto').classList.add('on');
  setCamera('hero');
  toast('Reset to Default View');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

function setFinish(name) {
  if (!MATERIALS.shells[name]) return;
  STATE.finish = name;
  const mat = MATERIALS.shells[name];
  if (R.leftChassis) R.leftChassis.material = mat;
  if (R.rightChassis) R.rightChassis.material = mat;
  toast(`Finish: ${name}`);
}

function setCamera(mode) {
  STATE.cameraMode = mode;
  $$('#camwrap .cami').forEach(b => b.classList.toggle('on', b.dataset.cam === mode));
  const presets = {
    hero: { pos: new THREE.Vector3(3.2, 2.0, 3.4), look: new THREE.Vector3(0, 0.2, 0) },
    front: { pos: new THREE.Vector3(0, 0.2, 4.2), look: new THREE.Vector3(0, 0.2, 0) },
    side: { pos: new THREE.Vector3(4.2, 0.2, 0), look: new THREE.Vector3(0, 0.2, 0) },
    top: { pos: new THREE.Vector3(0, 5.0, 0.1), look: new THREE.Vector3(0, 0, 0) },
    detail: { pos: new THREE.Vector3(1.4, 0.8, 1.4), look: new THREE.Vector3(0.5, 0.3, 0) }
  };
  const target = presets[mode] || presets.hero;
  STATE.targetCamPos.copy(target.pos);
  STATE.targetCamLook.copy(target.look);
}

function bindUI() {
  $('#btnOpen').addEventListener('click', toggleOpen);
  $('#btnExplode').addEventListener('click', toggleExplode);
  $('#btnCam').addEventListener('click', () => $('#camwrap').classList.toggle('open'));
  $('#btnFinish').addEventListener('click', () => $('#matwrap').classList.toggle('open'));
  $('#btnLight').addEventListener('click', toggleCinematic);
  $('#btnAuto').addEventListener('click', toggleAuto);
  $('#btnReset').addEventListener('click', resetAll);
  $('#btnFull').addEventListener('click', toggleFullscreen);

  $$('#camwrap .cami').forEach(btn => {
    btn.addEventListener('click', () => {
      setCamera(btn.dataset.cam);
      $('#camwrap').classList.remove('open');
    });
  });

  // Finish selector chips
  const fw = $('#matwrap');
  fw.innerHTML = CONFIG.finishes.map(f => {
    const col = {
      Natural: '#c4cad4',
      Midnight: '#1a1d24',
      Silver: '#e5e8ed',
      Graphite: '#363a42',
      White: '#f5f7fb',
      'Deep Blue': '#162438'
    }[f];
    return `<div class="fin" data-f="${f}"><div class="sw" style="background:${col};width:18px;height:18px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;border:1px solid rgba(255,255,255,0.2);"></div><small style="vertical-align:middle;">${f}</small></div>`;
  }).join('');

  fw.querySelectorAll('.fin').forEach(b => {
    b.addEventListener('click', () => {
      setFinish(b.dataset.f);
      $('#matwrap').classList.remove('open');
    });
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'o') toggleOpen();
    else if (k === 'e') toggleExplode();
    else if (k === 'r') resetAll();
    else if (k === 'a') toggleAuto();
    else if (k === 'c') toggleCinematic();
    else if (k === 'f') toggleFullscreen();
  });
}

/* ==========================================================================
   ANIMATION LOOP (60 FPS)
   ========================================================================== */
function animate(now) {
  requestAnimationFrame(animate);

  const delta = Math.min((now - STATE.lastTime) / 1000, 0.1);
  STATE.lastTime = now;

  // Smooth open/fold transition (180 degree hinge)
  STATE.openProgress = lerp(STATE.openProgress, STATE.targetOpen, 0.08);
  const openAngle = STATE.openProgress * Math.PI * 0.5; // up to 90 deg each side
  if (R.leftPanel) R.leftPanel.rotation.y = openAngle;
  if (R.rightPanel) R.rightPanel.rotation.y = -openAngle;

  // Smooth explode transition
  STATE.explodeProgress = lerp(STATE.explodeProgress, STATE.targetExplode, 0.08);
  const ex = STATE.explodeProgress * 0.45;
  if (R.leftPanel) R.leftPanel.position.x = -ex;
  if (R.rightPanel) R.rightPanel.position.x = ex;

  // Auto rotation
  if (STATE.autoRotate && R.deviceGroup) {
    R.deviceGroup.rotation.y += CONFIG.autoRotateSpeed * delta;
  }

  // Camera lerp
  R.camera.position.lerp(STATE.targetCamPos, 0.05);
  R.controls.target.lerp(STATE.targetCamLook, 0.05);
  R.controls.update();

  // Render post-processed frame
  if (R.composer) {
    R.composer.render();
  }
}

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
window.addEventListener('DOMContentLoaded', () => {
  setLoader(0.2, 'Compiling shaders…');
  initScene();
  setLoader(0.5, 'Synthesizing materials…');
  makeMaterials();
  setLoader(0.7, 'Constructing Apple Duo body…');
  buildDevice();
  initLights();
  bindUI();
  setLoader(1.0, 'Ready');

  // Fade out loader
  setTimeout(() => {
    const l = $('#loader');
    if (l) l.classList.add('gone');
    $('#brand').classList.add('show');
    $('#meta').classList.add('show');
    $('#controls').classList.add('show');
    $('#modecap').classList.add('show');
  }, 400);

  requestAnimationFrame(animate);
});
</script>
